services:
  database:
    image: postgis/postgis:18-3.7
    environment:
      POSTGRES_DB: ${DB_NAME:-ploggr}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/init/20-app-role.sh:/docker-entrypoint-initdb.d/20-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  storage:
    image: chrislusf/seaweedfs:4.54
    command: mini -dir=/data -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: ${EVIDENCE_S3_ACCESS_KEY:?Run make setup for local storage credentials}
      AWS_SECRET_ACCESS_KEY: ${EVIDENCE_S3_SECRET_KEY:?Run make setup for local storage credentials}
      S3_BUCKET: ${EVIDENCE_S3_BUCKET:-ploggr-evidence}
    ports:
      - "127.0.0.1:${EVIDENCE_S3_PORT:-8333}:8333"
    volumes:
      - evidence_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/readyz"]
      interval: 2s
      timeout: 5s
      retries: 40

volumes:
  evidence_data:
  postgres_data:
